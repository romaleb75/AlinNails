<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main-page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Laska Beauty Israel</title>
  </head>
  <body>
    <div class="top-image">
      <img src="./images/top.jpeg" alt="nail collection table" />
    </div>
    <div class="logo-image">
      <img src="./images/logo.png" alt="Laska Logo" />
    </div>
    <h1 class="main-title">Laska</h1>
    <h2 class="sub-title">Nails & Eyelashes</h2>
    <br />
    <h6 class="address">Ohel Sarah 5, Holon, Israel</h6>
    <div class="buttons-bubble">
      <div class="whatsapp btn">
        <i class="fa-brands fa-whatsapp"></i>
        <p>WhatsApp</p>
      </div>
      <div class="about btn">
        <i class="fa-solid fa-address-card"></i>
        <p>About</p>
      </div>
      <div class="instagram btn">
        <i class="fa-brands fa-instagram"></i>
        <p>Instagram</p>
      </div>
      <div class="waze btn">
        <i class="fa-solid fa-location-dot"></i>
        <p>Waze</p>
      </div>
    </div>
    <div class="booking-btn">
      <a href="" target="">Book Now</a>
    </div>
    <p>⬈ Hit Me Up If You're Ready To Glow ⬉</p>
    <h2 class="my-work">My Work</h2>
    <div class="work-gallery">
        <img src="./images/work1.jpg" alt="">
        <img src="./images/work2.jpg" alt="">
        <img src="./images/work3.jpg" alt="">
        <img src="./images/work4.jpg" alt="">
    </div>
    </div>
